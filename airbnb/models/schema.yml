models:
  - name: dim_listings_cleansed
    description: This is a cleaned stable for AirBnB listings
    data_tests:
      - minimum_row_count:
          arguments: 
            min_row_count: 1000
          severity: warn 

    columns:
      - name: listing_id
        description: Primary key for the listing
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: Primary key for the host
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleanses')
                field: host_id

      - name: room_type
        description: The type of the room / apartment / house
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listings_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_host_cleansed
    config:   
      contract:
        enforced: true
    
    columns:
      - name: host_id
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null

      - name: host_name
        data_type: string
        data_tests:
          - not_null

      - name: is_superhost
        data_type: string
        data_tests:
          - accepted_values:
              arguments: 
                values: ['t','f']
      - name: updated_at
        data_type: timestamp
      - name: created_at
        data_type: timestamp